name: Code Quality

on:
  pull_request:
    paths-ignore:
      - 'assets/**'
      - 'README.md'
      - 'LICENSE.md'
      - 'scripts/**'
      - 'docs/*'
  push:
    paths-ignore:
      - 'assets/**'
      - 'README.md'
      - 'LICENSE.md'
      - 'scripts/**'
      - 'docs/*'

permissions:
  contents: read

jobs:

  runtime:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Test
      run: npm test -- --ci --runInBand

    - name: Typecheck
      run: npm run typecheck

    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: '1'

  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Biome
      uses: biomejs/setup-biome@v2
      with:
        version: 2.6.3

    - name: Format Checking
      run: biome format . --verbose


  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Biome
      uses: biomejs/setup-biome@v2
      with:
        version: 2.6.3

    - name: Lint Checking
      run: biome lint . --verbose
